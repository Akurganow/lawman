name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: journal
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun build --compile --target=bun-linux-x64 src/journal.ts --outfile journal-smoke
      - run: ./journal-smoke --version
      - name: Clean through the compiled binary
        run: test "$(printf 'a <!-- hidden --> ![x](https://e.example/i.png)' | ./journal-smoke clean)" = "a [x](https://e.example/i.png)"

  fence:
    runs-on: ubuntu-latest
    env:
      LAWMAN_FENCE_NAMES: ${{ secrets.LAWMAN_FENCE_NAMES }}
      FENCE_PATHS: skills :!skills/assembly :!skills/lawman-law/references/harnesses
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Class fence
        run: |
          grep -vE '^(#|[[:space:]]*$)' fence-patterns.txt > "$RUNNER_TEMP/fence.txt"
          rc=0
          hits=$(git grep -nIE -f "$RUNNER_TEMP/fence.txt" -- $FENCE_PATHS | cut -d: -f1,2; exit "${PIPESTATUS[0]}") || rc=$?
          if [ "$rc" -gt 1 ]; then echo "fence scan error"; exit 2; fi
          if [ "$rc" -eq 0 ]; then echo "$hits"; echo "class fence failed"; exit 1; fi
          echo "class fence clean"
      - name: Names fence
        if: env.LAWMAN_FENCE_NAMES != ''
        run: |
          rc=0
          hits=$(git grep -nIiE -e "$LAWMAN_FENCE_NAMES" -- $FENCE_PATHS | cut -d: -f1,2; exit "${PIPESTATUS[0]}") || rc=$?
          if [ "$rc" -gt 1 ]; then echo "fence scan error"; exit 2; fi
          if [ "$rc" -eq 0 ]; then echo "$hits"; echo "names fence failed"; exit 1; fi
          echo "names fence clean"

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Leak scan
        run: |
          rc=0
          hits=$(git grep -nIE -e '/Users/[a-z]' -e '/home/[a-z]' -e 'gh[pousr]_[A-Za-z0-9]{20,}' -e 'github_pat_[A-Za-z0-9_]{20,}' -- . ':(exclude)fence-patterns.txt' ':(exclude).git' ':(exclude)node_modules' | cut -d: -f1,2; exit "${PIPESTATUS[0]}") || rc=$?
          if [ "$rc" -gt 1 ]; then echo "leak scan error"; exit 2; fi
          if [ "$rc" -eq 0 ]; then echo "$hits"; echo "leak scan failed"; exit 1; fi
          echo "no leaks"

  ignore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: git check-ignore -q docs/gangsta/x

  # Hermes refuses a plugin update unless its scanner rates the tree safe.
  # The scanner comes from the newest Hermes, the one users update to.
  hermes-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: plugin
          persist-credentials: false
      - run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git hermes
      - name: Plugin scan
        run: |
          python3 -I - <<'EOF'
          import sys
          sys.path.insert(0, "hermes")
          from pathlib import Path
          from tools.plugin_guard import scan_plugin
          result = scan_plugin(Path("plugin"), source="community")
          for f in result.findings:
              print(f.severity, f.file, f.pattern_id)
          print("verdict:", result.verdict)
          sys.exit(0 if result.verdict == "safe" else 1)
          EOF
