on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-latest
          - target: bun-darwin-x64
            os: macos-latest
          - target: bun-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Check the version against the tag
        run: test "$(bun run src/journal.ts --version)" = "${GITHUB_REF_NAME#v}"
      - name: Test
        run: bun test
      - name: Compile
        run: bun build --compile --target=${{ matrix.target }} src/journal.ts --outfile journal-${{ matrix.target }}
      - name: Sign ad-hoc with entitlements (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --entitlements entitlements.plist journal-${{ matrix.target }}
          codesign --verify --verbose journal-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journal-${{ matrix.target }}
          path: journal-${{ matrix.target }}
          if-no-files-found: error

  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: journal-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 journal-* > SHA256SUMS
      - name: Attest binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/journal-*
      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber journal-* SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes journal-* SHA256SUMS
          fi
