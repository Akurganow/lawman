on:
  push:
    tags:
      - "v*"
    branches:
      - release-trial

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-latest
          - target: bun-darwin-x64
            os: macos-latest
          - target: bun-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        working-directory: journal
        run: bun install --frozen-lockfile
      - name: Check the version against the tag
        if: github.ref_type == 'tag'
        working-directory: journal
        run: test "$(bun run src/journal.ts --version)" = "${GITHUB_REF_NAME#v}"
      - name: Test
        working-directory: journal
        run: bun test
      - name: Compile
        working-directory: journal
        run: bun build --compile --target=${{ matrix.target }} src/journal.ts --outfile ../journal-${{ matrix.target }}
      - name: Sign ad-hoc with entitlements (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --entitlements journal/entitlements.plist journal-${{ matrix.target }}
          codesign --verify --verbose journal-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journal-${{ matrix.target }}
          path: journal-${{ matrix.target }}
          if-no-files-found: error

  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: journal-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 journal-* > SHA256SUMS
      - name: Attest journal-bun-darwin-arm64
        id: attest-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/journal-bun-darwin-arm64
      - name: Attest journal-bun-darwin-x64
        id: attest-darwin-x64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/journal-bun-darwin-x64
      - name: Attest journal-bun-linux-x64
        id: attest-linux-x64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/journal-bun-linux-x64
      - name: Attest journal-bun-linux-arm64
        id: attest-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/journal-bun-linux-arm64
      - name: Place the provenance files beside the binaries
        env:
          ARM64_DARWIN: ${{ steps.attest-darwin-arm64.outputs.bundle-path }}
          X64_DARWIN: ${{ steps.attest-darwin-x64.outputs.bundle-path }}
          X64_LINUX: ${{ steps.attest-linux-x64.outputs.bundle-path }}
          ARM64_LINUX: ${{ steps.attest-linux-arm64.outputs.bundle-path }}
        run: |
          cp "$ARM64_DARWIN" dist/journal-bun-darwin-arm64.sigstore.json
          cp "$X64_DARWIN" dist/journal-bun-darwin-x64.sigstore.json
          cp "$X64_LINUX" dist/journal-bun-linux-x64.sigstore.json
          cp "$ARM64_LINUX" dist/journal-bun-linux-arm64.sigstore.json
      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      # The notes are the changelog section that cog bump wrote for the tag,
      # headed "## <tag> - <date>".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type == 'tag'
        with:
          path: source
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Publish release
        if: github.ref_type == 'tag'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber journal-* SHA256SUMS
          else
            notes="$RUNNER_TEMP/notes.md"
            awk -v head="## $GITHUB_REF_NAME " 'index($0, head) == 1 { p = 1; next } p && (/^- - -$/ || /^## /) { exit } p' \
              ../source/CHANGELOG.md > "$notes"
            [ -s "$notes" ] || { echo "::error::no changelog section for $GITHUB_REF_NAME"; exit 1; }
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" journal-* SHA256SUMS
          fi
